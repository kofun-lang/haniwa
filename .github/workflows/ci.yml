name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stage0:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test portable contract
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run native host smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/haniwa --smoke-test
      - name: Run native host smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./build/haniwa.app/Contents/MacOS/haniwa --smoke-test
      - name: Run native host smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/haniwa.exe --smoke-test
      - name: Enforce 2 MiB host ceiling (Linux)
        if: runner.os == 'Linux'
        run: cmake -DBINARY=${{ github.workspace }}/build/haniwa -P tests/check_size.cmake
      - name: Enforce 2 MiB host ceiling (macOS)
        if: runner.os == 'macOS'
        run: cmake -DBINARY=${{ github.workspace }}/build/haniwa.app/Contents/MacOS/haniwa -P tests/check_size.cmake
      - name: Enforce 2 MiB host ceiling (Windows)
        if: runner.os == 'Windows'
        run: cmake -DBINARY=${{ github.workspace }}/build/Release/haniwa.exe -P tests/check_size.cmake
